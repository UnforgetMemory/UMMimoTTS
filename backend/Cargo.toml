[package]
name = "um-mimo-tts-server"
version = "3.0.0"
edition = "2021"
authors = ["UnforgetMemory"]
description = "MIMO v3 TTS Web Service - Layered DDD architecture with SQLite persistence"

[[bin]]
name = "um-mimo-tts-server"
path = "src/main.rs"

[dependencies]
actix-web = "4.13.0"
actix-multipart = "0.7.2"
actix-cors = "0.7.1"
actix-files = "0.6.10"
tokio = { version = "1.52.3", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
dotenvy = "0.15.7"
uuid = { version = "1.23.2", features = ["v4", "v7", "serde", "fast-rng"] }
chrono = { version = "0.4.44", features = ["serde"] }
futures = "0.3.32"
flume = "0.12.0"
thiserror = "2.0.18"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
base64 = "0.22.1"
parking_lot = "0.12"
async-stream = "0.3.6"
fastrand = "2"
linked-hash-map = "0.5"
rust-embed = "8.11.0"
mime_guess = "2"
zip = "0.6"
sanitize-filename = "0.6.0"
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"

[dev-dependencies]
actix-rt = "2"
actix-test = "0.1"
wiremock = "0.6.5"
tokio-util = { version = "0.7", features = ["rt"] }
