[package]
name = "mimo-tts-server"
version = "1.0.0"
edition = "2021"
authors = ["UnforgetMemory"]
description = "MIMO v2.5 TTS Web Service - 智能语音合成平台，支持超长文本分片合成"
repository = "https://github.com/UnforgetMemory/UMMimoTTS"
license = "MIT"
keywords = ["tts", "mimo", "voice-synthesis", "rust", "vue"]

[dependencies]
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
dotenvy = "0.15"
uuid = { version = "1.6", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
flume = "0.11"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
parking_lot = "0.12"
async-stream = "0.3"
fastrand = "2"
