<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>UM-MimoTTS 工作台</title>
    <script>
      // Pre-hydration flash guard: restore the stored theme before React
      // mounts (dark is the default).
      try {
        var t = localStorage.getItem('um-mimotts.theme') || 'dark';
        document.documentElement.classList.toggle('dark', t === 'dark');
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
